# OpenOCD configuration for smart_car (STM32F407 + CMSIS-DAP)
# Usage:
#   openocd -f openocd.cfg                         # start debug server
#   openocd -f openocd.cfg -c "program build/smart_car.elf verify reset exit"  # flash

# ---- Debug adapter (CMSIS-DAP) ----
source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 4000

# ---- Target (STM32F4x) ----
source [find target/stm32f4x.cfg]

# ---- Reset config ----
# DJI Dev Board: nRESET pin not properly wired, use software reset
cortex_m reset_config sysresetreq